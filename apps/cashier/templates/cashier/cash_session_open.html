{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Ouvrir la caisse" %}{% endblock %}
{% block content %}
<div class="page-header"><div><h1>{% trans "Ouvrir la caisse" %}</h1></div></div>
<div class="card-app" style="max-width: 420px;">
    <div class="card-app-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">{{ form.opening_amount.label }}</label>
                {{ form.opening_amount }}
                {{ form.opening_amount.errors }}
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-unlock"></i> {% trans "Ouvrir" %}</button>
                <a href="{% url 'core:home' %}" class="btn btn-outline-secondary">{% trans "Annuler" %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
