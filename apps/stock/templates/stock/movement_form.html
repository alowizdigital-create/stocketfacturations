{% extends "base.html" %}
{% block title %}Nouveau mouvement de stock{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Nouveau mouvement de stock</h1></div></div>
<div class="card-app" style="max-width: 520px;">
    <div class="card-app-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                {{ field.errors }}
            </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'stock:stock_level_list' %}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
