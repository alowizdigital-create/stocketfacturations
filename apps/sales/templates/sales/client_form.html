{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouveau client" %}{% endblock %}
{% block content %}
<div class="page-header"><div><h1>{% trans "Nouveau client" %}</h1></div></div>
<div class="card-app" style="max-width: 560px;">
    <div class="card-app-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">{% trans "Enregistrer" %}</button>
                <a href="{% url 'sales:client_list' %}" class="btn btn-outline-secondary">{% trans "Annuler" %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
