{% extends "base.html" %}
{% block title %}Clients{% endblock %}
{% block content %}
<div class="page-header">
    <div class="d-flex gap-2">
        <a href="{% url 'sales:client_create' %}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nouveau client</a>
        <a href="{% url 'sales:client_import' %}" class="btn btn-outline-secondary"><i class="bi bi-upload"></i> Importer</a>
    </div>
</div>
<div class="table-app">
    <table class="table mb-0">
        <thead><tr><th>Nom</th><th>Téléphone</th><th class="d-none d-md-table-cell">Email</th></tr></thead>
        <tbody>
            {% for client in clients %}
            <tr><td class="fw-semibold">{{ client.name }}</td><td>{{ client.phone|default:"—" }}</td><td class="d-none d-md-table-cell">{{ client.email|default:"—" }}</td></tr>
            {% empty %}
            <tr><td colspan="3" class="text-muted text-center py-4">Aucun client.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
