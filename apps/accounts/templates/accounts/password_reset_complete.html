{% extends "base.html" %}
{% block title %}Mot de passe changé{% endblock %}
{% block auth_content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><i class="bi bi-boxes"></i> Stock &amp; Facturation</div>
        <h1 class="h5 mb-3"><i class="bi bi-check-circle text-success"></i> Mot de passe changé</h1>

            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Se connecter</a>

</div>
{% endblock %}
