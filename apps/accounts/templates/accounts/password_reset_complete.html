{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Mot de passe changé" %}{% endblock %}
{% block auth_content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><i class="bi bi-boxes"></i> Zweey</div>
        <h1 class="h5 mb-3"><i class="bi bi-check-circle text-success"></i> {% trans "Mot de passe changé" %}</h1>
        <p class="text-muted small mb-0">{% trans "Votre mot de passe a été modifié avec succès." %}</p>
        <p class="text-center mt-3 mb-0">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">{% trans "Se connecter" %}</a>
        </p>
    </div>
</div>
{% endblock %}
